<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="DiskHaY Cat Mascot">
  <defs>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="catRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="catEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#catBg)" stroke="url(#catRing)" stroke-width="3.5"/>

  <g clip-path="url(#circleClip)">
    <!-- Body & collar -->
    <path d="M30 118c2-20 14-31 30-31s28 11 30 31z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M40 90c6 5 34 5 40 0" fill="none" stroke="url(#catRing)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="60" cy="96" r="5.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="96" r="2" fill="#34d399"/>

    <!-- Ears -->
    <path d="M27 56L24 22l24 15z" fill="url(#catFur)" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M93 56l3-34-24 15z" fill="url(#catFur)" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M30 50l-2-20 15 10z" fill="#f472b6" opacity="0.72"/>
    <path d="M90 50l2-20-15 10z" fill="#f472b6" opacity="0.72"/>

    <!-- Head -->
    <ellipse cx="60" cy="62" rx="33" ry="28" fill="url(#catFur)" stroke="#475569" stroke-width="1.8"/>

    <!-- Forehead stripes -->
    <path d="M60 35v7M53 37l2 6M67 37l-2 6" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>

    <!-- Cheek fur tufts -->
    <path d="M27 64l-5-2 4 6M93 64l5-2-4 6" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="46" cy="59" rx="7.2" ry="8" fill="#080b12"/>
    <ellipse cx="74" cy="59" rx="7.2" ry="8" fill="#080b12"/>
    <ellipse cx="46" cy="59.5" rx="5.4" ry="6.2" fill="url(#catEye)"/>
    <ellipse cx="74" cy="59.5" rx="5.4" ry="6.2" fill="url(#catEye)"/>
    <ellipse cx="46" cy="60" rx="2.6" ry="4.5" fill="#04101b"/>
    <ellipse cx="74" cy="60" rx="2.6" ry="4.5" fill="#04101b"/>
    <circle cx="43.5" cy="56.5" r="2.2" fill="#ffffff"/>
    <circle cx="71.5" cy="56.5" r="2.2" fill="#ffffff"/>
    <circle cx="48.5" cy="62.5" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="76.5" cy="62.5" r="1" fill="#ffffff" opacity="0.8"/>

    <!-- Nose & mouth -->
    <path d="M56.5 68.5h7l-3.5 4z" fill="#f472b6"/>
    <path d="M60 72.5c0 3-3.5 4.5-6 3M60 72.5c0 3 3.5 4.5 6 3" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="36" cy="68" rx="4.5" ry="2.4" fill="#f472b6" opacity="0.28"/>
    <ellipse cx="84" cy="68" rx="4.5" ry="2.4" fill="#f472b6" opacity="0.28"/>

    <!-- Whiskers -->
    <path d="M35 66l-13-2M35 70l-14 1M36 74l-12 4" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <path d="M85 66l13-2M85 70l14 1M84 74l12 4" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
