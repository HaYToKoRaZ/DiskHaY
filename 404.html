<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | DiskHaY</title>
    <meta name="description" content="The requested page could not be found on DiskHaY.">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="HaYTo">
    <meta name="publisher" content="HaYTooL">
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="assets/diskhay-logo.svg" sizes="any">
    <link rel="icon" type="image/png" href="assets/diskhay-logo.png" sizes="512x512">
    <link rel="apple-touch-icon" href="assets/diskhay-logo.png" sizes="512x512">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="style.css">
    </noscript>
    <style>
        :root{--bg:#080b12;--surface:rgba(18,25,39,.82);--border:rgba(148,163,184,.16);--text:#f1f5f9;--muted:#94a3b8;--primary:#38bdf8;--primary-strong:#0284c7;--accent:#34d399;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace}
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.6;overflow-x:hidden;position:relative}
        .container{width:min(1160px,92%);margin:0 auto}
        a{color:inherit;text-decoration:none}
        .navbar{position:sticky;top:0;z-index:50;background:rgba(8,11,18,.84);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
        .nav-content{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:68px;flex-wrap:wrap;padding:.5rem 0}
        .brand{display:inline-flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.15rem}
        .brand-logo{border-radius:8px}
        .brand-tag{font-size:.72rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;background:rgba(56,189,248,.14);color:var(--primary);border:1px solid rgba(56,189,248,.3)}
        .nav-links{display:flex;align-items:center;gap:1.15rem;font-size:.92rem;font-weight:500}
        .nav-links>a{color:var(--muted)}
        .nav-portal{color:var(--accent)!important;font-weight:600}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.78rem 1.3rem;border-radius:10px;font-weight:600;font-size:.94rem;border:1px solid transparent;cursor:pointer}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#04101b;font-weight:700}
        .btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
        .gradient-text{background:linear-gradient(120deg,#38bdf8,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
        .not-found {
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1rem;
        }
        .nf-card {
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2.4rem 2rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }
        .nf-mascot {
            margin: 0 auto 1rem;
            border-radius: 50%;
            display: block;
        }
        .nf-code {
            font-family: var(--font-mono);
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.6rem;
        }
        .nf-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.65rem;
        }
        .nf-card p {
            color: var(--muted);
            margin-bottom: 1.6rem;
        }
        .nf-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>

    <header class="navbar">
        <div class="container nav-content">
            <a href="./" class="brand" title="DiskHaY Home">
                <img src="assets/diskhay-logo.svg" alt="DiskHaY Logo" class="brand-logo" width="34" height="34">
                <span class="brand-name">DiskHaY</span>
                <span class="brand-tag">HaYTooL</span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="./" title="Return to DiskHaY Home" id="navHome">Home</a>
                <a href="https://haytool.online/" target="_blank" rel="nofollow noopener noreferrer" class="nav-portal" title="Visit HaYTooL Portal">HaYTooL Portal ↗</a>
            </nav>
        </div>
    </header>

    <main class="not-found">
        <div class="nf-card">
            <img src="assets/diskhay-mascot.svg" alt="DiskHaY Lady Mascot" class="nf-mascot" width="96" height="96">
            <div class="nf-code gradient-text">404</div>
            <h1 id="nfTitle">Page Not Found</h1>
            <p id="nfDesc">The page you are looking for does not exist or has been moved.</p>
            <div class="nf-actions">
                <a href="./" class="btn btn-primary" title="Back to DiskHaY Homepage" id="nfHomeBtn">Back to Home</a>
                <a href="https://github.com/HaYToKoRaZ/DiskHaY/releases/latest" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-secondary" title="Download latest DiskHaY release" id="nfDlBtn">Download DiskHaY</a>
                <a href="https://haytool.online/" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-ghost" title="Visit HaYTooL Portal">HaYTooL Portal ↗</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="assets/diskhay-logo.svg" alt="DiskHaY Logo" width="26" height="26">
                <span><strong>DiskHaY</strong> — © 2026 HaYTooL.</span>
            </div>
            <div class="footer-links">
                <a href="./" title="DiskHaY Home">Home</a>
                <a href="https://haytool.online/" target="_blank" rel="nofollow noopener noreferrer" title="Visit HaYTooL Portal">HaYTooL Portal</a>
                <a href="https://github.com/HaYToKoRaZ/DiskHaY" target="_blank" rel="nofollow noopener noreferrer" title="DiskHaY GitHub Repository">GitHub</a>
            </div>
        </div>
    </footer>

    <script>
        const NF_I18N = {
            tr: { home: "Ana Sayfa", title: "Sayfa Bulunamadı", desc: "Aradığınız sayfa mevcut değil veya taşınmış olabilir.", back: "Ana Sayfaya Dön", dl: "DiskHaY'i İndir" },
            en: { home: "Home", title: "Page Not Found", desc: "The page you are looking for does not exist or has been moved.", back: "Back to Home", dl: "Download DiskHaY" },
            es: { home: "Inicio", title: "Página no encontrada", desc: "La página que buscas no existe o ha sido movida.", back: "Volver al inicio", dl: "Descargar DiskHaY" },
            de: { home: "Startseite", title: "Seite nicht gefunden", desc: "Die gesuchte Seite existiert nicht oder wurde verschoben.", back: "Zur Startseite", dl: "DiskHaY laden" },
            fr: { home: "Accueil", title: "Page introuvable", desc: "La page que vous recherchez n'existe pas ou a été déplacée.", back: "Retour à l'accueil", dl: "Télécharger DiskHaY" },
            ru: { home: "Главная", title: "Страница не найдена", desc: "Запрашиваемая страница не существует или была перемещена.", back: "На главную", dl: "Скачать DiskHaY" },
            pt: { home: "Início", title: "Página não encontrada", desc: "A página que você procura não existe ou foi movida.", back: "Voltar ao início", dl: "Baixar DiskHaY" },
            zh: { home: "首页", title: "页面未找到", desc: "您访问的页面不存在或已被移动。", back: "返回首页", dl: "下载 DiskHaY" },
            ar: { home: "الرئيسية", title: "الصفحة غير موجودة", desc: "الصفحة التي تبحث عنها غير موجودة أو تم نقلها.", back: "العودة للرئيسية", dl: "تنزيل DiskHaY" },
            hi: { home: "होम", title: "पृष्ठ नहीं मिला", desc: "आप जो पृष्ठ खोज रहे हैं वह मौजूद नहीं है या स्थानांतरित हो गया है।", back: "होम पर वापस जाएँ", dl: "DiskHaY डाउनलोड करें" }
        };
        let lang = "en";
        try {
            const saved = localStorage.getItem("diskhay_lang");
            if (saved && NF_I18N[saved]) lang = saved;
            else {
                const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
                if (NF_I18N[nav]) lang = nav;
            }
        } catch (_) {}
        const d = NF_I18N[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.getElementById("navHome").textContent = d.home;
        document.getElementById("nfTitle").textContent = d.title;
        document.getElementById("nfDesc").textContent = d.desc;
        document.getElementById("nfHomeBtn").textContent = d.back;
        document.getElementById("nfDlBtn").textContent = d.dl;
    </script>
</body>
</html>
