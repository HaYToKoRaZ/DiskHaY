name: Release and Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content "main/Cargo.toml" -Raw
          if ($cargo -match 'version\s*=\s*"([^"]+)"') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected Version: v$ver" -ForegroundColor Green

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main -> target

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Release Binary
        shell: pwsh
        run: |
          cd main
          cargo build --release --locked -p diskhay-app

      - name: Create Portable & Setup Packages
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:VERSION
          $dist = "dist"
          if (-not (Test-Path $dist)) { New-Item -ItemType Directory -Force -Path $dist | Out-Null }
          $sourceExe = if (Test-Path "main/target/release/diskhay.exe") {
            "main/target/release/diskhay.exe"
          } elseif (Test-Path "target/release/diskhay.exe") {
            "target/release/diskhay.exe"
          } else {
            throw "diskhay.exe bulunamadi!"
          }
          Write-Host "Bulunan binary: $sourceExe"
          Copy-Item $sourceExe -Destination "$dist/diskhay.exe" -Force

          # 1. Portable ZIP paketi
          $portableDir = "$dist/diskhay-v$ver-windows-x64-portable"
          if (Test-Path $portableDir) { Remove-Item -Recurse -Force $portableDir }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item "$dist/diskhay.exe" -Destination $portableDir -Force
          Copy-Item "README.md" -Destination $portableDir -Force
          Copy-Item "LICENSE" -Destination $portableDir -Force
          Copy-Item "main/packaging/windows/diskhay.ini" -Destination $portableDir -Force

          $portableZip = "$dist/diskhay-v$ver-windows-x64-portable.zip"
          if (Test-Path $portableZip) { Remove-Item -Force $portableZip }
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -CompressionLevel Optimal
          Remove-Item -Recurse -Force $portableDir

          $zipHash = (Get-FileHash -Path $portableZip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$portableZip.sha256" -Value "$zipHash  diskhay-v$ver-windows-x64-portable.zip`n" -NoNewline
          Write-Host "Portable package created: $portableZip"

          # 2. Inno Setup ile Setup EXE paketi
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          & $iscc "/DMyAppVersion=$ver" "main/packaging/windows/installer.iss"

          $setupExe = "$dist/diskhay-v$ver-windows-x64-setup.exe"
          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$setupExe.sha256" -Value "$setupHash  diskhay-v$ver-windows-x64-setup.exe`n" -NoNewline
          Write-Host "Setup package created: $setupExe"

          Get-ChildItem -Path $dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diskhay-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip.sha256
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe.sha256
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DiskHaY ${{ steps.version.outputs.tag }}
          body: |
            ## 🚀 DiskHaY ${{ steps.version.outputs.tag }}

            [🇬🇧 English](#-english) • [🇹🇷 Türkçe](#-türkçe)

            ---

            ### 🇬🇧 English
            Pre-built distribution packages for Windows x64 & Linux x86_64:
            - 📦 **Windows Installer (Setup):** `diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe`
            - 🧳 **Windows Portable (ZIP):** `diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip`
            - 🐧 **Linux x86_64:** `diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz` (unpack and run `./install.sh`)
            - 🔒 Includes `.sha256` checksum files for integrity verification.

            ---

            ### 🇹🇷 Türkçe
            Windows x64 ve Linux x86_64 için oluşturulmuş hazır dağıtım paketleri:
            - 📦 **Windows Kurulum Paketi (Setup):** `diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe`
            - 🧳 **Windows Taşınabilir Sürüm (Portable):** `diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip`
            - 🐧 **Linux x86_64:** `diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz` (arşivi açıp `./install.sh` çalıştırın)
            - 🔒 Bütünlük kontrolü için `.sha256` doğrulama dosyaları eklenmiştir.
          files: |
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-portable.zip.sha256
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/diskhay-v${{ steps.version.outputs.version }}-windows-x64-setup.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-package:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-latest
    # Runs after the Windows job so both attach to the same, already
    # created release without racing to create it.
    needs: windows-package
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Version from Cargo.toml
        id: version
        run: |
          ver=$(grep -m1 '^version' main/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Detected Version: v$ver"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main -> target

      - name: Build Release Binary
        working-directory: main
        run: cargo build --release --locked -p diskhay-app

      - name: Create Linux Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          name="diskhay-v${VERSION}-x86_64-linux"
          mkdir -p dist "dist/${name}"
          cp main/target/release/diskhay "dist/${name}/diskhay"
          cp main/assets/diskhay.svg "dist/${name}/diskhay.svg"
          cp main/packaging/diskhay.desktop.in "dist/${name}/diskhay.desktop.in"
          cp main/packaging/install.sh "dist/${name}/install.sh"
          cp README.md LICENSE "dist/${name}/"
          echo "${VERSION}" > "dist/${name}/VERSION"
          chmod 755 "dist/${name}/diskhay" "dist/${name}/install.sh"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -la dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diskhay-v${{ steps.version.outputs.version }}-x86_64-linux
          path: |
            dist/diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            dist/diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            dist/diskhay-v${{ steps.version.outputs.version }}-x86_64-linux.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
